<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | System Glitch</title>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --neon-blue: #00f0ff;
            --text-dim: #8a8d98;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .error-container {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        /* The Veo Glitch Core */
        .glitch-video {
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
            border-radius: 4px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        p {
            color: var(--text-dim);
            font-size: 1rem;
            margin-bottom: 30px;
        }

        /* Return Button */
        .return-btn {
            display: inline-block;
            background: transparent;
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 12px 24px;
            font-size: 0.9rem;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 2px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .return-btn:hover {
            background: var(--neon-blue);
            color: var(--bg-dark);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            font-weight: bold;
        }

        /* Scanline Overlay to match your index style */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            z-index: 999;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <video autoplay muted loop playsinline class="glitch-video">
            <source src="lander.mp4" type="video/mp4">
        </video>
        
        <h1>System Error: 404</h1>
        <p>You have drifted outside the synchronized boundaries of the network.</p>
        
        <a href="index.html" class="return-btn">Re-Initialize Mainframe</a>
    </div>

    <div class="scanlines"></div>

</body>
</html>
