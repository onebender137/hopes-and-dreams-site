<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neuro-Launchpad — Hotspot Dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root {
    --bg-main: #0a0f2b;
    --neon-blue: #38bdf8;
    --neon-gold: #fbbf24;
    --neon-purple: #a855f7;
    --text-main: #f8fafc;
    --text-dim: #94a3b8;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: var(--bg-main);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
#hero-launchpad {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
#brain-svg-wrap {
    position: relative;
    max-width: 92vw;
    max-height: 78vh;
    animation: hormetic-throb 3.5s ease-in-out infinite;
    will-change: transform, filter;
}
#brain-svg-wrap svg { width: 100%; height: 100%; display: block; }

/* Hotspot regions — invisible but interactive */
.hotspot-region {
    fill: rgba(56,189,248,0);
    stroke: none;
    cursor: pointer;
    transition: fill 0.3s ease;
}
.hotspot-region:hover { fill: rgba(56,189,248,0.1); }

/* DEBUG MODE: uncomment this to see hotspot boundaries while tuning paths */
/*
.hotspot-region {
    fill: rgba(56,189,248,0.15);
    stroke: rgba(56,189,248,0.4);
    stroke-width: 1;
    stroke-dasharray: 4 2;
}
*/

.hotspot-glow {
    fill: none;
    stroke: var(--neon-blue);
    stroke-width: 1.5;
    opacity: 0;
    pointer-events: none;
}
.hex-label-group { pointer-events: none; opacity: 0; }
.hex-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    fill: var(--neon-blue);
    letter-spacing: 3px;
}
.decoded-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 24px;
    font-weight: 900;
    fill: var(--neon-gold);
    letter-spacing: 4px;
    opacity: 0;
}
.conn-line {
    stroke: var(--neon-blue);
    stroke-width: 2;
    stroke-dasharray: 8 5;
    opacity: 0;
    fill: none;
}
.node-dot {
    fill: var(--neon-blue);
    opacity: 0;
}
.label-bg {
    fill: rgba(10,15,43,0.92);
    stroke: var(--neon-blue);
    stroke-width: 1.2;
}
.label-bg-gold {
    fill: rgba(10,15,43,0.92);
    stroke: var(--neon-gold);
    stroke-width: 1.2;
}

#hero-main-title {
    position: absolute;
    bottom: 4vh;
    left: 0; right: 0;
    text-align: center;
    font-size: clamp(1rem, 2.8vw, 2.2rem);
    font-weight: 900;
    color: var(--text-main);
    letter-spacing: 10px;
    z-index: 10;
    pointer-events: none;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: geometricPrecision;
    isolation: isolate;
    contain: layout style paint;
}
#hero-instruction {
    position: absolute;
    top: 3vh;
    font-family: 'JetBrains Mono', monospace;
    color: var(--neon-gold);
    letter-spacing: 4px;
    font-weight: 900;
    font-size: clamp(0.5rem, 1.1vw, 0.8rem);
    animation: blink 2s infinite;
    z-index: 10;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
@keyframes hormetic-throb {
    0%,100% {
        transform: scale(1);
        filter: drop-shadow(0 0 25px rgba(56,189,248,0.3))
                drop-shadow(0 0 50px rgba(168,85,247,0.15));
    }
    50% {
        transform: scale(1.04);
        filter: drop-shadow(0 0 50px rgba(56,189,248,0.6))
                drop-shadow(0 0 100px rgba(168,85,247,0.35))
                drop-shadow(0 0 140px rgba(56,189,248,0.15));
    }
}
.scanlines {
    position: fixed;
    top:0;left:0;width:100vw;height:100vh;
    background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.06) 50%),
                linear-gradient(90deg, rgba(255,0,0,0.015), rgba(0,255,0,0.006), rgba(0,0,255,0.015));
    background-size: 100% 3px, 3px 100%;
    pointer-events: none;
    opacity: 0.2;
    z-index: 100;
}
#status-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(10,15,43,0.92);
    border-top: 1px solid rgba(56,189,248,0.15);
    padding: 6px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    z-index: 200;
    letter-spacing: 1px;
}
#status-bar .active-module { color: var(--neon-gold); font-weight: 700; }

/* Dev tools overlay */
#dev-coords {
    position: fixed;
    top: 10px;
    right: 10px;
    background: rgba(10,15,43,0.95);
    border: 1px solid var(--neon-blue);
    padding: 8px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--neon-blue);
    z-index: 300;
    border-radius: 4px;
    min-width: 180px;
}
#dev-coords .label { color: var(--text-dim); font-size: 9px; }

@media (max-width: 600px) {
    #hero-main-title { font-size: 0.9rem; letter-spacing: 4px; bottom: 6vh; }
    #hero-instruction { font-size: 0.5rem; letter-spacing: 2px; top: 2vh; }
    .hex-text { font-size: 8px; }
    .decoded-text { font-size: 9px; }
    #brain-svg-wrap { max-width: 98vw; max-height: 65vh; }
}
</style>
</head>
<body>
<div id="hero-launchpad">
    <div id="brain-svg-wrap">
        <!--
            HYBRID SVG: topper.png embedded as <image>, hotspot <path>s overlaid.
            viewBox matches the PNG dimensions (1780x1050).
            All hotspot coords are in this coordinate space.
            
            TO TUNE HOTSPOTS:
            1. Uncomment the debug CSS block above to see path boundaries
            2. Use the dev coordinate readout (top-right) to find coords
            3. Edit the path d="" values below
            4. Reload and test
        -->
        <svg viewBox="340 0 1200 950" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="gf" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="6" result="b"/>
                    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
            </defs>

            <!-- THE BRAIN — transparent PNG, no bounding box -->
            <image href="topper.png" x="0" y="0" width="1780" height="1050"/>

            <!-- =============================================
                 HOTSPOT REGIONS
                 These paths are approximate — tune on the Beast
                 with debug CSS enabled to see boundaries.
                 Coordinate space: 1780 x 1050
                 ============================================= -->

            <!-- PROCUREMENT — Upper-left lobe (neural network web, sparkle nodes) -->
            <g class="hotspot-group" data-section="Procurement" data-hex="50 52 4F 43" data-label="PROCUREMENT MODULE" data-page="shop.html">
                <path class="hotspot-region" d="
                    M 580 250
                    C 560 290, 540 350, 560 410
                    C 580 450, 640 470, 700 440
                    C 740 420, 750 360, 735 310
                    C 720 260, 650 230, 580 250 Z"/>
                <circle class="hotspot-glow" cx="650" cy="350" r="75" filter="url(#gf)"/>
                <circle class="node-dot" cx="650" cy="350" r="8"/>
            </g>

            <!-- OPTIMIZATION — Upper-right where star trail meets brain -->
            <g class="hotspot-group" data-section="Optimization" data-hex="4F 50 54 49" data-label="OPTIMIZATION MODULE" data-page="optimization.html">
                <path class="hotspot-region" d="
                    M 750 220
                    C 790 200, 870 220, 910 280
                    C 940 330, 930 400, 895 430
                    C 860 460, 790 440, 765 390
                    C 735 340, 720 270, 750 220 Z"/>
                <circle class="hotspot-glow" cx="835" cy="325" r="75" filter="url(#gf)"/>
                <circle class="node-dot" cx="835" cy="325" r="8"/>
            </g>

            <!-- INTEL HUB — Lower-left (big cyan swirl area) -->
            <g class="hotspot-group" data-section="Intel Hub" data-hex="49 4E 54 4C" data-label="INTEL RELAY" data-page="intel.html">
                <path class="hotspot-region" d="
                    M 560 480
                    C 530 520, 520 590, 550 660
                    C 575 710, 640 740, 710 710
                    C 760 690, 770 630, 750 570
                    C 730 510, 640 465, 560 480 Z"/>
                <circle class="hotspot-glow" cx="650" cy="590" r="80" filter="url(#gf)"/>
                <circle class="node-dot" cx="650" cy="590" r="8"/>
            </g>

            <!-- ABOUT — Lower-right / bottom (purple tail, brainstem) -->
            <g class="hotspot-group" data-section="About" data-hex="41 42 4F 55" data-label="ABOUT SYNDICATE" data-page="about.html">
                <path class="hotspot-region" d="
                    M 740 500
                    C 780 480, 860 500, 900 560
                    C 935 610, 920 690, 880 740
                    C 840 780, 770 770, 740 720
                    C 710 670, 700 550, 740 500 Z"/>
                <circle class="hotspot-glow" cx="820" cy="620" r="80" filter="url(#gf)"/>
                <circle class="node-dot" cx="820" cy="620" r="8"/>
            </g>

            <!-- PRIVACY — Shooting star burst (gold star, top-right) -->
            <g class="hotspot-group" data-section="Privacy" data-hex="50 56 43 59" data-label="PRIVACY PROTOCOL" data-page="privacy.html">
                <path class="hotspot-region" d="
                    M 950 100
                    C 1010 70, 1150 80, 1210 170
                    C 1260 250, 1240 360, 1170 400
                    C 1100 440, 1020 400, 975 330
                    C 930 260, 900 160, 950 100 Z"/>
                <circle class="hotspot-glow" cx="1090" cy="240" r="90" filter="url(#gf)"/>
                <circle class="node-dot" cx="1090" cy="240" r="8"/>
            </g>

            <!-- =============================================
                 HEX-DECODE LABELS
                 Bigger text, wider boxes, positioned in margins
                 ============================================= -->

            <!-- Procurement — upper-left -->
            <g class="hex-label-group" id="label-group-Procurement">
                <line class="conn-line" x1="650" y1="350" x2="470" y2="250"/>
                <rect class="label-bg" x="350" y="198" width="380" height="80" rx="5"/>
                <text class="hex-text" x="540" y="233" text-anchor="middle">50 52 4F 43</text>
                <text class="decoded-text" x="540" y="265" text-anchor="middle">PROCUREMENT MODULE</text>
            </g>

            <!-- Optimization — upper-right -->
            <g class="hex-label-group" id="label-group-Optimization">
                <line class="conn-line" x1="835" y1="325" x2="1150" y2="420"/>
                <rect class="label-bg" x="1050" y="388" width="400" height="80" rx="5"/>
                <text class="hex-text" x="1250" y="423" text-anchor="middle">4F 50 54 49</text>
                <text class="decoded-text" x="1250" y="455" text-anchor="middle">OPTIMIZATION MODULE</text>
            </g>

            <!-- Intel Hub — lower-left -->
            <g class="hex-label-group" id="label-group-Intel-Hub">
                <line class="conn-line" x1="650" y1="590" x2="460" y2="720"/>
                <rect class="label-bg" x="350" y="695" width="320" height="80" rx="5"/>
                <text class="hex-text" x="510" y="730" text-anchor="middle">49 4E 54 4C</text>
                <text class="decoded-text" x="510" y="762" text-anchor="middle">INTEL RELAY</text>
            </g>

            <!-- About — lower-right -->
            <g class="hex-label-group" id="label-group-About">
                <line class="conn-line" x1="820" y1="620" x2="1150" y2="720"/>
                <rect class="label-bg" x="1050" y="695" width="360" height="80" rx="5"/>
                <text class="hex-text" x="1230" y="730" text-anchor="middle">41 42 4F 55</text>
                <text class="decoded-text" x="1230" y="762" text-anchor="middle">ABOUT SYNDICATE</text>
            </g>

            <!-- Privacy — top-right near star -->
            <g class="hex-label-group" id="label-group-Privacy">
                <line class="conn-line" x1="1090" y1="240" x2="1250" y2="110"/>
                <rect class="label-bg-gold" x="1150" y="60" width="370" height="80" rx="5"/>
                <text class="hex-text" x="1335" y="95" text-anchor="middle" style="fill:var(--neon-gold)">50 56 43 59</text>
                <text class="decoded-text" x="1335" y="127" text-anchor="middle">PRIVACY PROTOCOL</text>
            </g>
        </svg>
    </div>

    <div id="hero-main-title">HOPES AND DREAMS</div>
    <div id="hero-instruction">HOVER REGIONS TO DECODE ◆ CLICK TO INITIALIZE</div>
</div>

<div id="status-bar">
    <span>SYNDICATE NEURAL INTERFACE v2.0</span>
    <span>MODULE: <span class="active-module" id="active-module">STANDBY</span></span>
    <span id="coord-display">REGION: --</span>
</div>

<!-- Dev coordinate readout — shows SVG coords as you move mouse over brain -->
<div id="dev-coords">
    <div class="label">SVG COORDINATES</div>
    <div>X: <span id="dx">--</span> Y: <span id="dy">--</span></div>
</div>

<div class="scanlines"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const groups = document.querySelectorAll('.hotspot-group');
    const moduleDisplay = document.getElementById('active-module');
    const coordDisplay = document.getElementById('coord-display');
    const svg = document.querySelector('#brain-svg-wrap svg');
    const dxEl = document.getElementById('dx');
    const dyEl = document.getElementById('dy');

    // DEV: Show SVG coordinates on mouse move (for tuning hotspot paths)
    svg.addEventListener('mousemove', (e) => {
        const pt = svg.createSVGPoint();
        pt.x = e.clientX;
        pt.y = e.clientY;
        const svgPt = pt.matrixTransform(svg.getScreenCTM().inverse());
        dxEl.textContent = Math.round(svgPt.x);
        dyEl.textContent = Math.round(svgPt.y);
    });

    groups.forEach(group => {
        const section = group.dataset.section;
        const hexString = group.dataset.hex;
        const page = group.dataset.page;
        const labelId = 'label-group-' + section.replace(/\s+/g, '-');
        const labelGroup = document.getElementById(labelId);
        const glowCircle = group.querySelector('.hotspot-glow');
        const nodeDot = group.querySelector('.node-dot');
        if (!labelGroup) return;
        const connLine = labelGroup.querySelector('.conn-line');
        const hexText = labelGroup.querySelector('.hex-text');
        const decodedText = labelGroup.querySelector('.decoded-text');
        let hoverTl = null;
        let scrambleInterval = null;
        let glitchInterval = null;

        group.addEventListener('mouseenter', () => {
            moduleDisplay.textContent = section.toUpperCase();
            coordDisplay.textContent = 'REGION: ' + section.toUpperCase();
            if (hoverTl) hoverTl.kill();
            if (scrambleInterval) clearInterval(scrambleInterval);
            if (glitchInterval) clearInterval(glitchInterval);

            hoverTl = gsap.timeline();
            hoverTl.to(nodeDot, { opacity: 1, duration: 0.12 });
            hoverTl.to(glowCircle, { opacity: 0.5, duration: 0.3, ease: 'power2.out' }, '<0.05');
            hoverTl.to(connLine, { opacity: 0.6, duration: 0.25 }, '<0.08');
            hoverTl.to(labelGroup, { opacity: 1, duration: 0.18 }, '<0.08');

            // GLITCHY hex scramble — faster, more chaotic
            const chars = '0123456789ABCDEF!@#$%&*<>{}[]';
            let count = 0;
            let settled = false;
            scrambleInterval = setInterval(() => {
                let s = '';
                for (let i = 0; i < hexString.length; i++) {
                    if (hexString[i] === ' ') s += ' ';
                    else if (count > i * 1.5) s += hexString[i];
                    else s += chars[Math.floor(Math.random() * chars.length)];
                }
                hexText.textContent = s;
                // Random opacity flicker during scramble
                hexText.style.opacity = Math.random() > 0.15 ? '1' : '0.3';
                count++;
                if (count > hexString.length * 2.5) {
                    clearInterval(scrambleInterval);
                    scrambleInterval = null;
                    hexText.textContent = hexString;
                    hexText.style.opacity = '1';
                    settled = true;
                    // POST-SETTLE GLITCH: random re-corruptions
                    glitchInterval = setInterval(() => {
                        if (Math.random() > 0.6) {
                            let glitched = hexString.split('');
                            let pos = Math.floor(Math.random() * glitched.length);
                            if (glitched[pos] !== ' ') {
                                glitched[pos] = chars[Math.floor(Math.random() * 16)];
                            }
                            hexText.textContent = glitched.join('');
                            hexText.style.opacity = '0.7';
                            setTimeout(() => {
                                hexText.textContent = hexString;
                                hexText.style.opacity = '1';
                            }, 60 + Math.random() * 80);
                        }
                    }, 400 + Math.random() * 600);
                }
            }, 22);

            // Decoded label appears after hex settles
            hoverTl.to(decodedText, { opacity: 1, duration: 0.35, ease: 'power2.out' }, '+=0.25');
        });

        group.addEventListener('mouseleave', () => {
            moduleDisplay.textContent = 'STANDBY';
            coordDisplay.textContent = 'REGION: --';
            if (hoverTl) hoverTl.kill();
            if (scrambleInterval) { clearInterval(scrambleInterval); scrambleInterval = null; }
            if (glitchInterval) { clearInterval(glitchInterval); glitchInterval = null; }
            hexText.style.opacity = '1';
            gsap.to([nodeDot, glowCircle, connLine, labelGroup], { opacity: 0, duration: 0.2 });
            gsap.to(decodedText, { opacity: 0, duration: 0.1 });
        });

        // Click flash + nav
        group.addEventListener('click', () => {
            gsap.to(group.querySelector('.hotspot-region'), {
                fill: 'rgba(56,189,248,0.3)', duration: 0.1, yoyo: true, repeat: 1
            });
            moduleDisplay.textContent = 'LOADING ' + section.toUpperCase() + '...';
            moduleDisplay.style.color = '#38bdf8';
            // In production: window.location.href = page;
            setTimeout(() => { moduleDisplay.textContent = 'STANDBY'; moduleDisplay.style.color = ''; }, 1500);
        });
    });
});
</script>
</body>
</html>
