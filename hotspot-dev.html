<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neuro-Launchpad — Hotspot Dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root {
    --bg-main: #0a0f2b;
    --neon-blue: #38bdf8;
    --neon-gold: #fbbf24;
    --neon-purple: #a855f7;
    --text-main: #f8fafc;
    --text-dim: #94a3b8;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: var(--bg-main);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
#hero-launchpad {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
#brain-svg-wrap {
    position: relative;
    max-width: 92vw;
    max-height: 78vh;
    animation: hormetic-throb 3.5s ease-in-out infinite;
    will-change: transform, filter;
}
#brain-svg-wrap svg { width: 100%; height: 100%; display: block; }

/* Hotspot regions — invisible but interactive */
.hotspot-region {
    fill: rgba(56,189,248,0);
    stroke: none;
    cursor: pointer;
    transition: fill 0.3s ease;
}
.hotspot-region:hover { fill: rgba(56,189,248,0.1); }

/* DEBUG MODE: uncomment this to see hotspot boundaries while tuning paths */
/*
.hotspot-region {
    fill: rgba(56,189,248,0.15);
    stroke: rgba(56,189,248,0.4);
    stroke-width: 1;
    stroke-dasharray: 4 2;
}
*/

.hotspot-glow {
    fill: none;
    stroke: var(--neon-blue);
    stroke-width: 1.5;
    opacity: 0;
    pointer-events: none;
}
.hex-label-group { pointer-events: none; opacity: 0; }
.hex-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    fill: var(--neon-blue);
    letter-spacing: 3px;
}
.decoded-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 24px;
    font-weight: 900;
    fill: var(--neon-gold);
    letter-spacing: 4px;
    opacity: 0;
}
.conn-line {
    stroke: var(--neon-blue);
    stroke-width: 2;
    stroke-dasharray: 8 5;
    opacity: 0;
    fill: none;
}
.node-dot {
    fill: var(--neon-blue);
    opacity: 0;
}
.label-bg {
    fill: rgba(10,15,43,0.92);
    stroke: var(--neon-blue);
    stroke-width: 1.2;
}
.label-bg-gold {
    fill: rgba(10,15,43,0.92);
    stroke: var(--neon-gold);
    stroke-width: 1.2;
}

#hero-main-title {
    position: absolute;
    bottom: 6vh;
    left: 0; right: 0;
    text-align: center;
    font-size: clamp(1rem, 2.8vw, 2.2rem);
    font-weight: 900;
    color: var(--text-main);
    letter-spacing: 10px;
    z-index: 10;
    pointer-events: none;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: geometricPrecision;
    isolation: isolate;
    contain: layout style paint;
}
#hero-instruction {
    position: absolute;
    bottom: 3vh;
    font-family: 'JetBrains Mono', monospace;
    color: var(--neon-gold);
    letter-spacing: 4px;
    font-weight: 900;
    font-size: clamp(0.5rem, 1.1vw, 0.8rem);
    animation: blink 2s infinite;
    z-index: 10;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
@keyframes hormetic-throb {
    0%,100% {
        transform: scale(1);
        filter: drop-shadow(0 0 25px rgba(56,189,248,0.3))
                drop-shadow(0 0 50px rgba(168,85,247,0.15));
    }
    50% {
        transform: scale(1.04);
        filter: drop-shadow(0 0 50px rgba(56,189,248,0.6))
                drop-shadow(0 0 100px rgba(168,85,247,0.35))
                drop-shadow(0 0 140px rgba(56,189,248,0.15));
    }
}
.scanlines {
    position: fixed;
    top:0;left:0;width:100vw;height:100vh;
    background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.06) 50%),
                linear-gradient(90deg, rgba(255,0,0,0.015), rgba(0,255,0,0.006), rgba(0,0,255,0.015));
    background-size: 100% 3px, 3px 100%;
    pointer-events: none;
    opacity: 0.2;
    z-index: 100;
}
#status-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(10,15,43,0.92);
    border-top: 1px solid rgba(56,189,248,0.15);
    padding: 6px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    z-index: 200;
    letter-spacing: 1px;
}
#status-bar .active-module { color: var(--neon-gold); font-weight: 700; }

/* Dev tools overlay */
#dev-coords {
    position: fixed;
    top: 10px;
    right: 10px;
    background: rgba(10,15,43,0.95);
    border: 1px solid var(--neon-blue);
    padding: 8px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--neon-blue);
    z-index: 300;
    border-radius: 4px;
    min-width: 180px;
}
#dev-coords .label { color: var(--text-dim); font-size: 9px; }

@media (max-width: 600px) {
    #hero-main-title { font-size: 0.9rem; letter-spacing: 4px; bottom: 8vh; }
    #hero-instruction { font-size: 0.5rem; letter-spacing: 2px; bottom: 4vh; }
    .hex-text { font-size: 8px; }
    .decoded-text { font-size: 9px; }
    #brain-svg-wrap { max-width: 98vw; max-height: 65vh; }
}
</style>
</head>
<body>
<div id="hero-launchpad">
    <div id="brain-svg-wrap">
        <!--
            HYBRID SVG: topper.png embedded as <image>, hotspot <path>s overlaid.
            viewBox matches the PNG dimensions (1780x1050).
            All hotspot coords are in this coordinate space.
            
            TO TUNE HOTSPOTS:
            1. Uncomment the debug CSS block above to see path boundaries
            2. Use the dev coordinate readout (top-right) to find coords
            3. Edit the path d="" values below
            4. Reload and test
        -->
        <svg viewBox="340 0 1200 950" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="gf" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="6" result="b"/>
                    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
            </defs>

            <!-- THE BRAIN — transparent PNG, no bounding box -->
            <image href="topper.png" x="0" y="0" width="1780" height="1050"/>

            <!-- =============================================
                 HOTSPOT REGIONS
                 These paths are approximate — tune on the Beast
                 with debug CSS enabled to see boundaries.
                 Coordinate space: 1780 x 1050
                 ============================================= -->

            <!-- PROCUREMENT — Upper-left frontal lobe (neural network clusters) -->
            <g class="hotspot-group" data-section="Procurement" data-hex="50 52 4F 43" data-label="PROCUREMENT MODULE" data-page="shop.html">
                <path class="hotspot-region" d="
                    M 520 220
                    C 490 260, 480 320, 510 380
                    C 530 420, 580 440, 630 410
                    C 660 385, 670 330, 655 280
                    C 640 230, 580 200, 520 220 Z"/>
                <circle class="hotspot-glow" cx="580" cy="320" r="70" filter="url(#gf)"/>
                <circle class="node-dot" cx="580" cy="320" r="8"/>
            </g>

            <!-- OPTIMIZATION — Upper-right (right side of neural net, near star trail) -->
            <g class="hotspot-group" data-section="Optimization" data-hex="4F 50 54 49" data-label="OPTIMIZATION MODULE" data-page="optimization.html">
                <path class="hotspot-region" d="
                    M 680 200
                    C 720 180, 790 200, 830 260
                    C 860 310, 855 380, 820 410
                    C 785 440, 720 420, 695 370
                    C 665 320, 650 250, 680 200 Z"/>
                <circle class="hotspot-glow" cx="760" cy="310" r="70" filter="url(#gf)"/>
                <circle class="node-dot" cx="760" cy="310" r="8"/>
            </g>

            <!-- INTEL HUB — Lower-left (lower swirl / brainstem area) -->
            <g class="hotspot-group" data-section="Intel Hub" data-hex="49 4E 54 4C" data-label="INTEL RELAY" data-page="intel.html">
                <path class="hotspot-region" d="
                    M 500 460
                    C 480 500, 475 560, 500 620
                    C 520 660, 575 685, 630 660
                    C 670 640, 680 580, 665 530
                    C 645 480, 570 445, 500 460 Z"/>
                <circle class="hotspot-glow" cx="580" cy="565" r="70" filter="url(#gf)"/>
                <circle class="node-dot" cx="580" cy="565" r="8"/>
            </g>

            <!-- ABOUT — Lower-right -->
            <g class="hotspot-group" data-section="About" data-hex="41 42 4F 55" data-label="ABOUT SYNDICATE" data-page="about.html">
                <path class="hotspot-region" d="
                    M 680 460
                    C 720 440, 785 455, 820 510
                    C 850 555, 845 620, 820 660
                    C 790 700, 730 690, 700 650
                    C 665 600, 650 500, 680 460 Z"/>
                <circle class="hotspot-glow" cx="760" cy="565" r="70" filter="url(#gf)"/>
                <circle class="node-dot" cx="760" cy="565" r="8"/>
            </g>

            <!-- PRIVACY — Shooting star burst (top-right) -->
            <g class="hotspot-group" data-section="Privacy" data-hex="50 56 43 59" data-label="PRIVACY PROTOCOL" data-page="privacy.html">
                <path class="hotspot-region" d="
                    M 880 80
                    C 940 50, 1060 70, 1110 160
                    C 1150 240, 1130 340, 1070 380
                    C 1010 420, 940 390, 900 320
                    C 860 250, 830 140, 880 80 Z"/>
                <circle class="hotspot-glow" cx="1000" cy="220" r="85" filter="url(#gf)"/>
                <circle class="node-dot" cx="1000" cy="220" r="8"/>
            </g>

            <!-- =============================================
                 HEX-DECODE LABELS
                 Bigger text, wider boxes, positioned in margins
                 ============================================= -->

            <!-- Procurement — left side -->
            <g class="hex-label-group" id="label-group-Procurement">
                <line class="conn-line" x1="580" y1="320" x2="440" y2="220"/>
                <rect class="label-bg" x="345" y="165" width="380" height="80" rx="5"/>
                <text class="hex-text" x="535" y="200" text-anchor="middle">50 52 4F 43</text>
                <text class="decoded-text" x="535" y="232" text-anchor="middle">PROCUREMENT MODULE</text>
            </g>

            <!-- Optimization — right side -->
            <g class="hex-label-group" id="label-group-Optimization">
                <line class="conn-line" x1="760" y1="310" x2="1100" y2="220"/>
                <rect class="label-bg" x="990" y="165" width="400" height="80" rx="5"/>
                <text class="hex-text" x="1190" y="200" text-anchor="middle">4F 50 54 49</text>
                <text class="decoded-text" x="1190" y="232" text-anchor="middle">OPTIMIZATION MODULE</text>
            </g>

            <!-- Intel Hub — left lower -->
            <g class="hex-label-group" id="label-group-Intel-Hub">
                <line class="conn-line" x1="580" y1="565" x2="440" y2="700"/>
                <rect class="label-bg" x="345" y="670" width="320" height="80" rx="5"/>
                <text class="hex-text" x="505" y="705" text-anchor="middle">49 4E 54 4C</text>
                <text class="decoded-text" x="505" y="737" text-anchor="middle">INTEL RELAY</text>
            </g>

            <!-- About — right lower -->
            <g class="hex-label-group" id="label-group-About">
                <line class="conn-line" x1="760" y1="565" x2="1100" y2="700"/>
                <rect class="label-bg" x="990" y="670" width="360" height="80" rx="5"/>
                <text class="hex-text" x="1170" y="705" text-anchor="middle">41 42 4F 55</text>
                <text class="decoded-text" x="1170" y="737" text-anchor="middle">ABOUT SYNDICATE</text>
            </g>

            <!-- Privacy — top right -->
            <g class="hex-label-group" id="label-group-Privacy">
                <line class="conn-line" x1="1000" y1="220" x2="1250" y2="80"/>
                <rect class="label-bg-gold" x="1140" y="30" width="370" height="80" rx="5"/>
                <text class="hex-text" x="1325" y="65" text-anchor="middle" style="fill:var(--neon-gold)">50 56 43 59</text>
                <text class="decoded-text" x="1325" y="97" text-anchor="middle">PRIVACY PROTOCOL</text>
            </g>
        </svg>
    </div>

    <div id="hero-main-title">HOPES AND DREAMS</div>
    <div id="hero-instruction">HOVER REGIONS TO DECODE ◆ CLICK TO INITIALIZE</div>
</div>

<div id="status-bar">
    <span>SYNDICATE NEURAL INTERFACE v2.0</span>
    <span>MODULE: <span class="active-module" id="active-module">STANDBY</span></span>
    <span id="coord-display">REGION: --</span>
</div>

<!-- Dev coordinate readout — shows SVG coords as you move mouse over brain -->
<div id="dev-coords">
    <div class="label">SVG COORDINATES</div>
    <div>X: <span id="dx">--</span> Y: <span id="dy">--</span></div>
</div>

<div class="scanlines"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const groups = document.querySelectorAll('.hotspot-group');
    const moduleDisplay = document.getElementById('active-module');
    const coordDisplay = document.getElementById('coord-display');
    const svg = document.querySelector('#brain-svg-wrap svg');
    const dxEl = document.getElementById('dx');
    const dyEl = document.getElementById('dy');

    // DEV: Show SVG coordinates on mouse move (for tuning hotspot paths)
    svg.addEventListener('mousemove', (e) => {
        const pt = svg.createSVGPoint();
        pt.x = e.clientX;
        pt.y = e.clientY;
        const svgPt = pt.matrixTransform(svg.getScreenCTM().inverse());
        dxEl.textContent = Math.round(svgPt.x);
        dyEl.textContent = Math.round(svgPt.y);
    });

    groups.forEach(group => {
        const section = group.dataset.section;
        const hexString = group.dataset.hex;
        const page = group.dataset.page;
        const labelId = 'label-group-' + section.replace(/\s+/g, '-');
        const labelGroup = document.getElementById(labelId);
        const glowCircle = group.querySelector('.hotspot-glow');
        const nodeDot = group.querySelector('.node-dot');
        if (!labelGroup) return;
        const connLine = labelGroup.querySelector('.conn-line');
        const hexText = labelGroup.querySelector('.hex-text');
        const decodedText = labelGroup.querySelector('.decoded-text');
        let hoverTl = null;
        let scrambleInterval = null;

        group.addEventListener('mouseenter', () => {
            moduleDisplay.textContent = section.toUpperCase();
            coordDisplay.textContent = 'REGION: ' + section.toUpperCase();
            if (hoverTl) hoverTl.kill();
            if (scrambleInterval) clearInterval(scrambleInterval);

            hoverTl = gsap.timeline();
            hoverTl.to(nodeDot, { opacity: 1, duration: 0.12 });
            hoverTl.to(glowCircle, { opacity: 0.5, duration: 0.3, ease: 'power2.out' }, '<0.05');
            hoverTl.to(connLine, { opacity: 0.6, duration: 0.25 }, '<0.08');
            hoverTl.to(labelGroup, { opacity: 1, duration: 0.18 }, '<0.08');

            // Hex scramble decode effect
            const chars = '0123456789ABCDEF';
            let count = 0;
            scrambleInterval = setInterval(() => {
                let s = '';
                for (let i = 0; i < hexString.length; i++) {
                    if (hexString[i] === ' ') s += ' ';
                    else if (count > i * 2) s += hexString[i];
                    else s += chars[Math.floor(Math.random() * 16)];
                }
                hexText.textContent = s;
                count++;
                if (count > hexString.length * 3) {
                    clearInterval(scrambleInterval);
                    scrambleInterval = null;
                    hexText.textContent = hexString;
                }
            }, 35);

            // Decoded label appears after hex settles
            hoverTl.to(decodedText, { opacity: 1, duration: 0.35, ease: 'power2.out' }, '+=0.25');
        });

        group.addEventListener('mouseleave', () => {
            moduleDisplay.textContent = 'STANDBY';
            coordDisplay.textContent = 'REGION: --';
            if (hoverTl) hoverTl.kill();
            if (scrambleInterval) { clearInterval(scrambleInterval); scrambleInterval = null; }
            gsap.to([nodeDot, glowCircle, connLine, labelGroup], { opacity: 0, duration: 0.2 });
            gsap.to(decodedText, { opacity: 0, duration: 0.1 });
        });

        // Click flash + nav
        group.addEventListener('click', () => {
            gsap.to(group.querySelector('.hotspot-region'), {
                fill: 'rgba(56,189,248,0.3)', duration: 0.1, yoyo: true, repeat: 1
            });
            moduleDisplay.textContent = 'LOADING ' + section.toUpperCase() + '...';
            moduleDisplay.style.color = '#38bdf8';
            // In production: window.location.href = page;
            setTimeout(() => { moduleDisplay.textContent = 'STANDBY'; moduleDisplay.style.color = ''; }, 1500);
        });
    });
});
</script>
</body>
</html>
