<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neuro-Launchpad — Hotspot Dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
    --bg-main: #0a0f2b;
    --neon-blue: #38bdf8;
    --neon-gold: #fbbf24;
    --neon-purple: #a855f7;
    --text-main: #f8fafc;
    --text-dim: #94a3b8;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: var(--bg-main);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
#hero-launchpad {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
#brain-svg-wrap {
    position: relative;
    max-width: 70vw;
    max-height: 60vh;
    animation: hormetic-throb 3.5s ease-in-out infinite;
    will-change: transform, filter;
}
#brain-svg-wrap svg { width: 100%; height: 100%; display: block; }

/* Hotspot regions — invisible but interactive */
.hotspot-region {
    fill: rgba(56,189,248,0);
    stroke: none;
    cursor: pointer;
    transition: fill 0.3s ease;
}
.hotspot-region:hover { fill: rgba(56,189,248,0.1); }
